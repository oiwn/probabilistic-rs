[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "probabilistic-rs"
version = "0.6.0"
requires-python = ">=3.9"

[tool.maturin]
features = ["python"]
module-name = "probabilistic_rs"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-v --tb=short"
